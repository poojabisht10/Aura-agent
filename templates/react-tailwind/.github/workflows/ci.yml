# =============================================================================
# CI Pipeline — Lint, Type-check & Build
# =============================================================================
# Runs on pushes to main/develop and on pull requests targeting main.
#
# Customization:
#   - Change NODE_VERSION to test against a different Node.js version.
#   - Change BUILD_COMMAND if your project uses a custom build script.
#   - Add additional steps (e.g., unit tests) after the build step.
# =============================================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'
  BUILD_COMMAND: 'npm run build'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: ${{ env.BUILD_COMMAND }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
